[workspace]
resolver = "2"
members = ["core/*", "server/*", "spikes/*"]
# Browser-only spikes (no Cargo.toml) must be excluded from the glob above.
exclude = ["spikes/webcodecs"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
repository = "https://github.com/kucherenko/prostor"
publish = false

[workspace.dependencies]
# workspace crates
prostor-model = { path = "core/prostor-model" }
prostor-engine = { path = "core/prostor-engine" }
prostor-protocol = { path = "core/prostor-protocol" }
prostor-wasm = { path = "core/prostor-wasm" }

# shared (compile on wasm32 and native)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12"

# browser boundary (prostor-wasm only)
wasm-bindgen = "0.2"
wasm-bindgen-test = "0.3"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

# server only
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
tower-http = { version = "0.7", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# tests
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"

[profile.release]
lto = "thin"
strip = "debuginfo"

# Used by `just build-wasm` (wasm-pack build --profile wasm-release): size first.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
