[package]
name = "prostor-server"
description = "prostor server: serves the web app, relays signaling, ingests FLV, publishes to RTMP destinations and records"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "prostor"
path = "src/main.rs"

[dependencies]
prostor-model = { workspace = true }
prostor-protocol = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true, features = ["time", "sync", "fs", "io-util"] }
tokio-util = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
percent-encoding = "2"

[dev-dependencies]
http-body-util = { workspace = true }
tempfile = { workspace = true }
tokio-tungstenite = "0.29"
futures-util = "0.3"
