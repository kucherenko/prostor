name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep in sync with rust-toolchain.toml.
  RUST_TOOLCHAIN: 1.93.0

jobs:
  rust:
    name: rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  deny:
    name: cargo deny (advisories, licenses, bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  wasm:
    name: wasm (tests in headless Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: wasm-pack@0.15.0
      - run: wasm-pack test --headless --chrome core/prostor-protocol
      - run: wasm-pack test --headless --chrome core/prostor-wasm

  web:
    name: web (types, lint, check, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: wasm-pack@0.15.0
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build wasm package
        run: >-
          wasm-pack build core/prostor-wasm --target web --profile wasm-release
          --out-dir "$GITHUB_WORKSPACE/web/src/lib/wasm/pkg" --out-name prostor_wasm
      - name: Generated TypeScript types are up to date
        run: |
          rm -rf web/src/lib/generated
          cargo test -p prostor-model --lib --quiet
          git diff --exit-code -- web/src/lib/generated
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm lint
        working-directory: web
      - run: pnpm check
        working-directory: web
      - run: pnpm test
        working-directory: web
      - run: pnpm build
        working-directory: web

  docker:
    name: docker (build only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: prostor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
