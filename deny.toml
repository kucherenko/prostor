# cargo-deny configuration: advisories, licenses and duplicate-crate policy.
# Run locally with `cargo deny check`; CI runs it on every push.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
# rml_rtmp 0.8 pulls old `sha2`/`hmac`/`rand` majors next to the current ones; keep
# that visible as a warning rather than failing the build.
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates reference each other by path without a version (they are never
# published), which cargo-deny would otherwise count as wildcards.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
